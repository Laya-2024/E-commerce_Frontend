<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>🛒 ShopCart</h1>
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="loginEmail" required>
                    <label>Email Address</label>
                    <span class="error" id="loginEmailError"></span>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" required>
                    <label>Password</label>
                    <span class="toggle-password" onclick="togglePassword('loginPassword')">👁️</span>
                    <span class="error" id="loginPasswordError"></span>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <p class="auth-link">Don't have an account? <a href="register.html">Register</a></p>
            </form>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
