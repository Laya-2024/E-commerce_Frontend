<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShopCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>🛒 ShopCart</h1>
            <h2>Create Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="regName" required>
                    <label>Full Name</label>
                    <span class="error" id="regNameError"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="regEmail" required>
                    <label>Email Address</label>
                    <span class="error" id="regEmailError"></span>
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" required>
                    <label>Password</label>
                    <span class="toggle-password" onclick="togglePassword('regPassword')">👁️</span>
                    <span class="error" id="regPasswordError"></span>
                </div>
                <div class="form-group">
                    <input type="password" id="regConfirm" required>
                    <label>Confirm Password</label>
                    <span class="toggle-password" onclick="togglePassword('regConfirm')">👁️</span>
                    <span class="error" id="regConfirmError"></span>
                </div>
                <button type="submit" class="btn-primary">Register</button>
                <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
            </form>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
